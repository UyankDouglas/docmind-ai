# DocMind AI — ambiente de desenvolvimento local
# Sobe: PostgreSQL+pgvector, Redis, MinIO, API FastAPI, Celery worker e frontend.
name: docmind

x-backend-env: &backend-env
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    MINIO_ENDPOINT: minio:9000

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docmind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmind}
      POSTGRES_DB: ${POSTGRES_DB:-docmind}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docmind} -d ${POSTGRES_DB:-docmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docmind-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # minio/minio saiu do Docker Hub; bitnamilegacy/minio é uma build MinIO (2025-05) congelada, adequada para dev.
    image: bitnamilegacy/minio:latest
    container_name: docmind-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docmind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docmind-minio-secret}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-docmind-documents}
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: docmind-api
    <<: *backend-env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "${API_PORT_HOST:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: docmind-worker
    <<: *backend-env
    command: >
      celery -A app.workers.celery_app:celery_app worker
      --loglevel=INFO --concurrency=2 --max-tasks-per-child=50
    volumes:
      - ./backend:/app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/web.Dockerfile
      target: dev
    container_name: docmind-web
    environment:
      VITE_API_URL: /api/v1
      VITE_PROXY_TARGET: http://api:8000
    # O volume nomeado isola o node_modules do host (Windows/macOS); se vier vazio ou inválido,
    # as dependências são instaladas dentro do contêiner antes de iniciar o Vite.
    command: >
      sh -c "if [ ! -f node_modules/vite/package.json ]; then
               rm -rf node_modules/.pnpm node_modules/.modules.yaml node_modules/.bin node_modules/*;
               pnpm install --frozen-lockfile --store-dir /app/node_modules/.pnpm-store;
             fi &&
             pnpm dev --host 0.0.0.0 --port 5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT_HOST:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
