name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind -d docmind_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
      TEST_DATABASE_URL: postgresql+psycopg://docmind:docmind@localhost:5432/docmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --frozen || uv sync
      - name: Ruff (lint + formato)
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Migrations sobem do zero
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://docmind:docmind@localhost:5432/docmind_test
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck + lint + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker Compose (config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose -f docker-compose.prod.yml config -q

  security:
    name: Segurança (auditoria de dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --strict
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pnpm audit (frontend)
        working-directory: apps/web
        run: pnpm audit --audit-level high

  docker-build:
    name: Docker (build das imagens de produção)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API/worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./docker/backend.Dockerfile
          push: false
          tags: docmind-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web (Caddy)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./docker/web.Dockerfile
          target: prod
          push: false
          tags: docmind-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E (Playwright contra a stack Docker)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env (provedores fake)
        run: |
          cp .env.example .env
          sed -i 's/^EMBEDDING_PROVIDER=.*/EMBEDDING_PROVIDER=fake/; s/^LLM_PROVIDER=.*/LLM_PROVIDER=fake/; s/^RATE_LIMIT_LOGIN_PER_MINUTE=.*/RATE_LIMIT_LOGIN_PER_MINUTE=100/' .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Subir a stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then echo pronto; break; fi
            sleep 5
          done
          docker compose ps
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Rodar E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: pnpm test
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail 200 api worker web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
