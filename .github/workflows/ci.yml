name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind -d docmind_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
      TEST_DATABASE_URL: postgresql+psycopg://docmind:docmind@localhost:5432/docmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --frozen || uv sync
      - name: Ruff (lint + formato)
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Migrations sobem do zero
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://docmind:docmind@localhost:5432/docmind_test
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck + lint + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker Compose (config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose -f docker-compose.prod.yml config -q
