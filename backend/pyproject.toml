[project]
name = "docmind-backend"
version = "0.1.0"
description = "DocMind AI — backend FastAPI com pipeline RAG (extração, chunking, embeddings, recuperação e geração)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "minio>=7.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "tiktoken>=0.8",
    "openai>=1.50",
    "httpx>=0.27",
    "structlog>=24.4",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["B008", "RUF012", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["I", "N", "E", "F401"]
"tests/*" = ["S", "B", "N"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: requer PostgreSQL+pgvector e MinIO acessíveis (TEST_DATABASE_URL)",
    "live_provider: requer OPENAI_API_KEY real e orçamento",
]
