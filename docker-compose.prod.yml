# DocMind AI — composição de produção (imagens construídas, sem volumes de código)
name: docmind-prod

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # minio/minio saiu do Docker Hub; bitnamilegacy/minio é uma build MinIO (2025-05) congelada, adequada para dev.
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2 --max-tasks-per-child=50 -B --schedule=/tmp/celerybeat-schedule
    depends_on:
      api: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 1g

  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/web.Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT_HOST:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
